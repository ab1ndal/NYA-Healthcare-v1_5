<!doctype html>
<!-- Book of projects: design options (v10). Not part of the deployed page. Serve this folder over http.
     Hardcover book model, rolling page turns, four chapters: VA San Diego, UC Irvine, Stanford, UCSF. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book of projects: design options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
:root{--display:'Cormorant Garamond',Georgia,serif;--body:'DM Sans',sans-serif;--ink:#151515;--ink2:#5b5a56;--light:#ece9e1;--gold:#22d3ff}
*{box-sizing:border-box}
html,body{margin:0;background:#0d1014;color:var(--light);font-family:var(--body)}
.pad{height:60vh;display:grid;place-items:center;color:#8a929b;font-size:14px}
.stage{position:sticky;top:0;height:100svh;overflow:clip;background:radial-gradient(58% 46% at 50% 70%,#25282c 0%,#16181b 42%,#0d1014 78%)}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(75% 70% at 50% 55%,#0000 55%,#05070ae6 100%)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
/* Real DOM text in the air above the book, one block per chapter. */
.air{position:absolute;left:50%;top:0;width:min(92vw,76rem);transform:translateX(-50%);pointer-events:none;
  display:grid;grid-template-columns:1.1fr 1fr;column-gap:clamp(2rem,6vw,7rem);align-content:start;padding-top:clamp(1rem,4svh,2.5rem)}
.air > .m{overflow:hidden;padding-bottom:.12em}
.air > .m > *{opacity:0;will-change:transform,opacity}
.air a{pointer-events:auto}
.m-specs{grid-column:1/-1;grid-row:3}.m-tag{grid-column:1;grid-row:1}.m-meta{grid-column:2;grid-row:1}.m-title{grid-column:1;grid-row:2}.m-right{grid-column:2;grid-row:2;align-self:end}
.a-tag{font-size:clamp(.72rem,.68rem + .2vw,.85rem);letter-spacing:.08em;color:var(--gold);margin:0 0 clamp(.5rem,1.4svh,1rem)}
.a-title{font-family:var(--display);font-weight:300;font-size:clamp(2.2rem,1.1rem + 3.2vw,4.4rem);line-height:.98;margin:0;text-wrap:balance}
.a-title.long{font-size:clamp(1.8rem,1rem + 2.2vw,3.2rem);max-width:17em}
.a-meta{font-size:clamp(.72rem,.68rem + .2vw,.85rem);letter-spacing:.02em;color:#c9ced4;margin:0 0 clamp(.5rem,1.4svh,1rem)}
.a-right{max-width:34rem}
.a-out{font-family:var(--display);font-style:italic;font-weight:300;font-size:clamp(1.1rem,.8rem + 1.1vw,1.8rem);line-height:1.22;margin:0 0 clamp(.6rem,1.6svh,1.1rem);color:#f3f0ea}
.a-link{font-size:.82rem;color:var(--light);text-decoration:underline;text-underline-offset:4px}
.a-specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(10.5rem,1fr));margin:clamp(.7rem,2svh,1.25rem) 0 0;border-top:1px solid #ece9e140}
.a-specs div{padding:.7rem 1rem 0 0}
.a-specs dt{font-size:.68rem;letter-spacing:.07em;color:#9aa3ad;margin:0 0 .25rem}
.a-specs dd{font-size:.86rem;line-height:1.35;margin:0}
.stage.warm{background:radial-gradient(70% 52% at 50% 70%,#7a6c5f 0%,#4a4038 44%,#211c18 86%)}
.stage.warm .a-tag{color:#ecdcc0}
.stage.warm .vig{background:radial-gradient(80% 75% at 50% 55%,#0000 58%,#0f0c0acc 100%)}
.opt-switch{position:fixed;right:1rem;bottom:1rem;z-index:10;display:flex;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 2rem);gap:1px;background:#ece9e133;border:1px solid #ece9e155}
.opt-switch button{min-height:44px;padding:0 1rem;border:0;background:#0d1014;color:#ece9e1;font:400 .8rem var(--body);cursor:pointer}
.opt-switch button[aria-pressed="true"]{background:#ece9e1;color:#151515}
.opt-switch button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<div class="pad">Scroll. Section before the book.</div>
<div class="runway" id="runway"><div class="stage" id="stage">
  <canvas id="c"></canvas>
  <div class="vig"></div>
</div></div>
<div class="pad">Section after the book.</div>
<div class="opt-switch" role="group" aria-label="Pop-up style">
  <button type="button" data-art="ink" aria-pressed="true">1 Watercolor in pieces</button>
  <button type="button" data-art="dioWarm" aria-pressed="false">2 Paper diorama, warm studio</button>
  <button type="button" data-art="dio" aria-pressed="false">3 Paper diorama, dark stage</button>
</div>

<script src="vendor/gsap.min.js"></script>
<script src="vendor/ScrollTrigger.min.js"></script>
<script type="module">
import * as THREE from './vendor/three.min.js';

/* ---------- chapters ----------
   name, role, place, architect, contractor, area, budget: AB's content block (2026-11-13).
   when and years (first year of the work, year the chapter lands on): BD+C (VA San Diego; UC Irvine award), UCI News (first patients),
   Stanford Medicine (groundbreaking, opening), UCSF (groundbreaking 2024, opening planned 2030; the chapter lands on the planned year).
   out and focus: today's card copy, except: VA San Diego (written from BD+C's project description), Stanford area (824,000 SF per Stanford Medicine,
   not the block's 850,000 SF), UCSF outcome sentence (880,000 SF, to match the area). All three are AB's to confirm (TODO B13, B14). */
const CH = [
  { key: 'va', page: 'La Jolla, California', tag: 'Seismic Retrofit', title: 'VA San Diego Hospital seismic retrofit', out: 'A six-story hospital from the early 1970s, strengthened with new foundations and exterior stair towers with integrated braced frames',
    role: 'Structural engineer', place: 'La Jolla, CA', years: [2005, 2008],
    specs: ['Leo A Daly', 'Clark Construction', '855,000 SF', '$55M', 'Built early 1970s · retrofit Nov 2005 to Apr 2008', 'Exterior stair towers · braced frames · new foundations'], link: null },
  { key: 'uci', page: 'Orange, California', tag: 'New Construction', title: 'UC Irvine Douglas Hospital',
    out: 'California’s first design-build hospital pioneered phased structural approvals, delivering the project on schedule and within budget',
    role: 'Structural engineer of record', place: 'Orange, CA', years: [2004, 2009],
    specs: ['HOK', 'Hensel Phelps', '475,000 SF', '$283M', 'Awarded Oct 2004 · first patients Mar 2009', 'Braced frames · shear walls · complex link'],
    link: 'https://www.nyase.com/uc-irvine-douglas-hospital/' },
  { key: 'stanford', page: 'Palo Alto, California', tag: 'New Construction – Base Isolation', title: 'Stanford Adult Hospital',
    out: 'A base-isolated hospital with a spectacular 120-foot column-free atrium, engineered to maintain patient care after a major earthquake',
    role: 'Structural engineer of record', place: 'Palo Alto, CA', years: [2013, 2019],
    specs: ['Rafael Viñoly Architects & Perkins Eastman', 'Clark - McCarthy JV', '824,000 SF', '$2B', 'Groundbreaking May 2013 · opened Nov 2019', 'Friction pendulum base isolation'],
    link: 'https://www.nyase.com/the-new-stanford-hospital/' },
  { key: 'ucsf', page: 'San Francisco, California', tag: 'New Construction – PBSD – SSI', title: 'UCSF Helen Diller Hospital',
    out: '880,000 SF on a steep triangular site, with dramatic cantilevers maximizing space and nearly 200 dampers enhancing seismic performance',
    role: 'Structural engineer of record', place: 'San Francisco, CA', years: [2024, 2030],
    specs: ['Herzog & de Meuron with HDR', 'Herrero Boldt Webcor', '880,000 SF', '$4.3B', 'Groundbreaking Apr 2024 · opening planned 2030', 'PBSD · SSI · Dampers · SidePlate™'],
    link: 'https://www.nyase.com/ucsf-health-helen-diller-hospital-at-parnassus/' },
];
const SPEC_LABELS = ['Architect', 'Contractor', 'Area', 'Budget', 'Timeline', 'Structural focus'];

/* ---------- sizes (page width = 1) and timeline (units of travel) ---------- */
const W = 1, H = 1.3, COLS = 30, ROWS = 6, T = 0.004;
const BOARD = 0.016, SQ = 0.022, BLOCK = 0.075;         // cover board thickness, board overhang, page block thickness
const DIP = 0.42, LAM = 0.085;                          // how far the pages sink into the gutter, and how quickly they recover
const LEAD = 0.34, TWIST = 0.16;                        // page turn: the outer edge leads the spine; the near corner leads the far one
const R = 5;                                            // loose leaves that riffle after the cover opens
const FL = 4, STEP = 9;                                 // leaves that turn between two chapters, and the gap between their starts
const C0 = 100, LEN = 124 + (FL - 1) * STEP, TRAVEL = C0 + LEN * (CH.length - 1) + 98;
const SLOW = 1.5, SCRUB = 1.1;

const stage = document.getElementById('stage'), runway = document.getElementById('runway'), canvas = document.getElementById('c');
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = t => t * t * (3 - 2 * t);
const easeW = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 30);

const hemi = new THREE.HemisphereLight(0xe6edf5, 0x14181d, 0.55); scene.add(hemi);
const key = new THREE.DirectionalLight(0xfff0d8, 1.6);            // behind and left: shadows fall forward across the pages
key.position.set(-1.7, 3.4, -2.3); key.castShadow = true;
key.shadow.mapSize.set(1024, 1024); key.shadow.radius = 8; key.shadow.bias = -0.0002; key.shadow.normalBias = 0.03;
Object.assign(key.shadow.camera, { left: -2.2, right: 2.2, top: 2.2, bottom: -2.2, near: 0.5, far: 12 }); scene.add(key);
const fill = new THREE.DirectionalLight(0xfff6e8, 1.0);           // in front: lights the pages, pieces shade the pieces behind
fill.position.set(1.3, 2.4, 3.2); fill.castShadow = true;
fill.shadow.mapSize.set(1024, 1024); fill.shadow.radius = 4; fill.shadow.bias = -0.0006; fill.shadow.normalBias = 0.02;
Object.assign(fill.shadow.camera, { left: -1.8, right: 1.8, top: 1.9, bottom: -1.0, near: 0.5, far: 10 }); scene.add(fill);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(14, 14), new THREE.ShadowMaterial({ opacity: 0.6 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.001; ground.receiveShadow = true; scene.add(ground);

/* ---------- textures ---------- */
const loader = new THREE.TextureLoader();
const srgb = t => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t; };
const mirror = t => { const m = t.clone(); m.wrapS = THREE.RepeatWrapping; m.repeat.x = -1; m.offset.x = 1; m.needsUpdate = true; return m; };
function canvasTex(draw, w = 800, h = 1040) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); return srgb(new THREE.CanvasTexture(c));
}
// A page as you look at it. spine: which edge is bound ('l' for a right-hand page, 'r' for a left-hand page).
function pageTex(spine, draw) {
  return canvasTex((g, w, h) => {
    g.fillStyle = '#efece4'; g.fillRect(0, 0, w, h);
    const im = g.getImageData(0, 0, w, h), d = im.data;                       // paper tooth
    for (let i = 0; i < d.length; i += 4) { const n = Math.random() * 7 - 3.5; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
    g.putImageData(im, 0, 0);
    if (draw) draw(g, w, h);
    const x0 = spine === 'l' ? 0 : w, x1 = spine === 'l' ? w * 0.2 : w * 0.8, gr = g.createLinearGradient(x0, 0, x1, 0);   // shade in the gutter
    gr.addColorStop(0, '#00000066'); gr.addColorStop(0.25, '#0000002b'); gr.addColorStop(1, '#00000000'); g.fillStyle = gr; g.fillRect(0, 0, w, h);
    const e0 = spine === 'l' ? w : 0, e1 = spine === 'l' ? w * 0.97 : w * 0.03, ge = g.createLinearGradient(e0, 0, e1, 0);  // slight fall-off at the fore-edge
    ge.addColorStop(0, '#0000001c'); ge.addColorStop(1, '#00000000'); g.fillStyle = ge; g.fillRect(0, 0, w, h);
  });
}
const label = (txt, right) => (g, w) => { g.fillStyle = '#5b5a56'; g.font = '400 19px "DM Sans", sans-serif'; g.textAlign = right ? 'right' : 'left'; g.fillText(txt, right ? w - 62 : 62, 78); };
// A year set large and faint at the outer edge, with a small label at the top. right: a right-hand page. at: baseline, as a share of the page height.
const yearPage = (y, right, top = String(y), at = 0.64) => (g, w, h) => {
  g.fillStyle = '#1515151c'; g.font = '300 250px "Cormorant Garamond", Georgia, serif'; g.textAlign = right ? 'right' : 'left'; g.fillText(String(y), right ? w - 62 : 62, h * at);
  label(top, right)(g, w);
};
function clothTex(color, draw) {
  return canvasTex((g, w, h) => {
    g.fillStyle = color; g.fillRect(0, 0, w, h);
    const im = g.getImageData(0, 0, w, h), d = im.data;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const n = ((x * 7 + y * 3) % 5 === 0 ? 7 : 0) + ((x + y * 5) % 4 === 0 ? -5 : 0) + (Math.random() * 8 - 4), i = (y * w + x) * 4;
      d[i] += n; d[i + 1] += n; d[i + 2] += n;
    }
    g.putImageData(im, 0, 0); if (draw) draw(g, w, h);
  });
}

/* ---------- the hardcover: back board, spine, front board that swings on the spine ---------- */
const GAPS = (CH.length - 1) * FL;                      // leaves that turn between chapters
const N = R + GAPS + 3;                                 // loose leaves: riffle, FL between chapters, a few at the back
const YTOP = BOARD + BLOCK + N * T;                     // underside of the front board when the book is shut
const AXIS = (YTOP + BOARD) / 2;                        // the board swings about the middle of the spine and lands flat on the table
const CLOTH = '#141d26';
const clothPlain = clothTex(CLOTH), endpaper = pageTex('l');
const std = (map, extra = {}) => new THREE.MeshStandardMaterial({ map, roughness: 0.9, metalness: 0, ...extra });
const boardGeo = new THREE.BoxGeometry(W + SQ, BOARD, H + SQ * 2);
function board(top, bottom) {                            // box faces: +x, -x, +y, -y, +z, -z
  const side = std(clothPlain), m = new THREE.Mesh(boardGeo, [side, side, std(top), std(bottom), side, side]);
  m.castShadow = m.receiveShadow = true; return m;
}
const backBoard = board(endpaper, clothPlain); backBoard.position.set((W + SQ) / 2, BOARD / 2, 0); scene.add(backBoard);
const frontHinge = new THREE.Group(); frontHinge.position.set(0, AXIS, 0); scene.add(frontHinge);
const frontBoard = board(clothPlain, endpaper); frontBoard.position.set((W + SQ) / 2, YTOP - AXIS + BOARD / 2, 0); frontHinge.add(frontBoard);
const spine = new THREE.Mesh(new THREE.BoxGeometry(YTOP + BOARD, 0.012, H + SQ * 2), std(clothPlain)); spine.castShadow = true; scene.add(spine);

/* ---------- page blocks: the bulk of the book, sunk into the gutter; mass moves from right to left as pages land ---------- */
const edgeTex = canvasTex((g, w, h) => { for (let y = 0; y < h; y += 2) { g.fillStyle = y % 4 ? '#ebe7dd' : '#dcd6c9'; g.fillRect(0, y, w, 2); } }, 32, 256);
edgeTex.wrapS = edgeTex.wrapT = THREE.RepeatWrapping;
function blockMesh(sign) {
  const sh = new THREE.Shape(), X = W - 0.014; sh.moveTo(0, 0); sh.lineTo(sign * X, 0); sh.lineTo(sign * X, 1);
  for (let k = 24; k >= 0; k--) { const x = X * k / 24; sh.lineTo(sign * x, 1 - DIP * Math.exp(-x / LAM)); }
  const geo = new THREE.ExtrudeGeometry(sh, { depth: H - 0.024, bevelEnabled: false, curveSegments: 1 }); geo.translate(0, 0, -(H - 0.024) / 2);
  const m = new THREE.Mesh(geo, std(edgeTex, { side: THREE.DoubleSide })); m.position.y = BOARD; m.castShadow = m.receiveShadow = true; scene.add(m); return m;
}
const blockR = blockMesh(1), blockL = blockMesh(-1);

/* ---------- loose leaves ---------- */
function leafGeometry() {
  const g = new THREE.BufferGeometry(), nx = COLS + 1, ny = ROWS + 1;
  const pos = new Float32Array(nx * ny * 3), uv = new Float32Array(nx * ny * 2), idx = [];
  for (let i = 0; i < nx; i++) for (let j = 0; j < ny; j++) {
    uv.set([i / COLS, 1 - j / ROWS], (i * ny + j) * 2);
    if (i < COLS && j < ROWS) { const a = i * ny + j, b = a + 1, c = a + ny, d = c + 1; idx.push(a, b, c, b, d, c); }
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.BufferAttribute(uv, 2)); g.setIndex(idx); return g;
}
// t 0 = lying on the right, 1 = lying on the left. The page rolls over: its outer edge leads, the bound edge follows,
// and the corner nearest the reader leaves first. At rest it follows the block down into the gutter.
function bendLeaf(geo, t, y0, dipR, dipL) {
  const p = geo.attributes.position.array, ds = W / COLS, ny = ROWS + 1;
  for (let j = 0; j < ny; j++) {
    const zn = j / ROWS - 0.5, tj = clamp(t + TWIST * Math.sin(Math.PI * t) * zn), z = -H / 2 + H * j / ROWS;
    const half = Math.PI * ease(tj) / 2, wR = Math.cos(half) ** 2, wL = Math.sin(half) ** 2;
    let x = 0, y = y0 - (wR * dipR + wL * dipL);
    p.set([x, y, z], j * 3);
    for (let i = 1; i <= COLS; i++) {
      const u = (i - 0.5) / COLS, s = u * W, th = Math.PI * ease(clamp(tj * (1 + LEAD) - LEAD * (1 - u)));
      const k = Math.exp(-s / LAM) / LAM, psi = th + wR * Math.atan(dipR * k) - wL * Math.atan(dipL * k);
      x += Math.cos(psi) * ds; y += Math.sin(psi) * ds; p.set([x, y, z], (i * ny + j) * 3);
    }
  }
  geo.attributes.position.needsUpdate = true; geo.computeVertexNormals(); geo.computeBoundingSphere();
}
const leaves = [];
function addLeaf(front, back) {
  const geo = leafGeometry(), f = new THREE.Mesh(geo, std(front, { side: THREE.FrontSide })), b = new THREE.Mesh(geo, std(mirror(back), { side: THREE.BackSide }));
  f.castShadow = b.castShadow = f.receiveShadow = b.receiveShadow = true; scene.add(f, b);
  const leaf = { geo, t: 0, sig: -1 }; leaves.push(leaf); return leaf;
}

/* ---------- pop-ups ---------- */
const mkPop = () => { const g = new THREE.Group(); scene.add(g); return { group: g, tiers: [] }; };
const pops = CH.map(() => ({ ink: mkPop(), dio: mkPop() }));
let style = 'ink';
function addTier(pop, tex, width, hingeZ, upright, o = {}) {
  const [u0, u1] = o.uv || [0, 1], [v0, v1] = o.vv || [0, 1];
  const h = width * tex.image.height * (v1 - v0) / (tex.image.width * (u1 - u0)), geo = new THREE.PlaneGeometry(width, h); geo.translate(0, h / 2 + (o.lift || 0), 0);
  const uv = geo.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, u0 + uv.getX(i) * (u1 - u0), v0 + uv.getY(i) * (v1 - v0));
  // Mostly self-lit so the painting keeps its colors, with enough diffuse for the front light's shadows to show.
  const mat = new THREE.MeshStandardMaterial({ map: tex, emissiveMap: tex, emissive: 0xffffff, emissiveIntensity: 0.62, color: 0x8a8a8a, roughness: 1, alphaTest: 0.5, alphaToCoverage: true, side: THREE.DoubleSide });
  const m = new THREE.Mesh(geo, mat); m.castShadow = m.receiveShadow = true; m.rotation.y = o.yaw || 0;
  m.customDepthMaterial = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: tex, alphaTest: 0.5 });
  const hinge = new THREE.Group(); hinge.position.set(o.x || 0, 0, hingeZ); hinge.add(m); pop.group.add(hinge);
  pop.tiers.push({ hinge, upright, mat, delay: o.delay || 0 });
}
const DIO = 0.8;         // the diorama set is scaled down so its backdrop clears the text above
const SEE = 0.37;       // a piece set back by d looks higher by about d * SEE from the chapter camera, so it is set lower by that much
// One painting as a V-fold across the gutter: two halves turned toward each other behind, the ground strip standing in front.
function vfold(pop, tex) {
  const A = tex.image.height / tex.image.width, S = Math.min(1.62, 0.66 / A), cut = 0.25, lap = 0.04, zB = 0.0, zF = 0.17;
  const lift = Math.max(0, S * A * (cut - lap) - (zF - zB) * 0.62);
  addTier(pop, tex, S * 0.51, zB, 1.45, { x: -S * 0.245, yaw: 0.09, uv: [0, 0.51], vv: [cut - lap, 1], lift, delay: 0 });
  addTier(pop, tex, S * 0.51, zB, 1.45, { x: S * 0.245, yaw: -0.09, uv: [0.49, 1], vv: [cut - lap, 1], lift, delay: 0.1 });
  addTier(pop, tex, S, zF, 1.40, { vv: [0, cut], delay: 0.3 });
}

/* ---------- text blocks ---------- */
const airs = CH.map((c, k) => {
  const el = document.createElement('article'); el.className = 'air';
  el.innerHTML = `<p class="a-tag"></p><h3 class="a-title"></h3><p class="a-meta"></p><div class="a-right"><p class="a-out"></p></div><dl class="a-specs"></dl>`;
  el.querySelector('.a-tag').textContent = `Chapter ${k + 1} of ${CH.length} · ${c.tag}`;
  el.querySelector('.a-title').textContent = c.title; el.querySelector('.a-title').classList.toggle('long', c.title.length > 30); el.querySelector('.a-out').textContent = c.out; el.querySelector('.a-meta').textContent = `${c.role} · ${c.place}`;
  if (c.link) { const a = document.createElement('a'); a.className = 'a-link'; a.href = c.link; a.textContent = `${c.title} project page`; el.querySelector('.a-right').append(a); }
  SPEC_LABELS.forEach((t, i) => { const d = document.createElement('div'); d.innerHTML = '<dt></dt><dd></dd>'; d.firstChild.textContent = t; d.lastChild.textContent = c.specs[i]; el.querySelector('.a-specs').append(d); });
  stage.append(el);
  return [...el.children].map(p => { const m = document.createElement('div'); m.className = 'm m-' + p.className.split('-')[1]; p.before(m); m.append(p); return p; });
});

/* ---------- cameras. tilt is measured from straight above; ty lifts the point the camera looks at ---------- */
const CAM_A = { d: 2.6, tilt: 0.70, tx: 0.5, ty: 0.04, tz: 0.08 };      // shut book, close
const CAM_B = { d: 3.7, tilt: 0.74, tx: 0, ty: 0.05, tz: 0.22 };           // open, whole book
const CAM_S = { d: 2.72, tilt: 1.22, tx: 0, ty: 0.50, tz: 0.05 };        // low in front: the building towers, air above for text
const mix = (a, b, t) => { const o = {}; for (const k in a) o[k] = a[k] + (b[k] - a[k]) * t; return o; };

/* ---------- one frame from one number ---------- */
const st = { t: 0 }; let frames = 0;
function update(travel) {
  // cover and spine
  const cov = easeW(seg(travel, 28, 66)); frontHinge.rotation.z = cov * Math.PI;
  spine.rotation.z = (1 - cov) * Math.PI / 2; spine.position.set(-0.007 * (1 - cov), AXIS + (0.006 - AXIS) * cov, 0);

  let turned = 0;
  leaves.forEach((L, i) => {
    if (i < R) { const s0 = 58 + i * 4.4; L.t = ease(seg(travel, s0, s0 + 16)); }
    else if (i < R + GAPS) { const c = C0 + Math.floor((i - R) / FL) * LEN + 104 + ((i - R) % FL) * STEP; L.t = easeW(seg(travel, c, c + 32)); }
    else L.t = 0;
    turned += L.t;

  const m = clamp(0.30 * turned / R, 0, 0.30) + Math.max(0, turned - R) * 0.11 / FL;      // share of the block that lies on the left
  const thR = BLOCK * (1 - m), thL = BLOCK * m;
  blockR.scale.y = Math.max(1e-4, thR); blockL.scale.y = Math.max(1e-4, thL); blockL.visible = thL > 0.0012 && cov > 0.98;
  leaves.forEach((L, i) => {
    const yR = BOARD + thR + (N - 1 - i) * T, yL = BOARD + thL + i * T, y0 = yR + (yL - yR) * L.t;
    const sig = L.t * 1e3 + y0 * 1e6; if (sig !== L.sig) { bendLeaf(L.geo, L.t, y0, DIP * thR, DIP * thL); L.sig = sig; }
  });
  // camera
  const low = easeW(seg(travel, C0 - 6, C0 + 32));
  const kc = clamp(Math.floor((travel - C0 + 14) / LEN), 0, CH.length - 1), lc = travel - C0 - kc * LEN, drift = seg(lc, 14, 106) - 0.5;
  let cam = mix(CAM_A, CAM_B, easeW(seg(travel, 22, 76))); cam = mix(cam, CAM_S, low);
  const fit = Math.max(1, (16 / 9) / camera.aspect), d = cam.d * Math.max(1, fit * 0.86) * (1 - 0.035 * seg(travel, 0, 28)) * (1 - 0.06 * (drift + 0.5) * low);
  camera.position.set(cam.tx + drift * 0.28 * low, cam.ty + Math.cos(cam.tilt) * d, cam.tz + Math.sin(cam.tilt) * d);
  camera.lookAt(cam.tx, cam.ty, cam.tz); camera.updateMatrixWorld();
  // chapters
  const top = BOARD + Math.max(thR, thL) + N * T + 0.002; let lit = 0;
  CH.forEach((_, k) => {
    const l = travel - C0 - k * LEN, last = k === CH.length - 1;
    const landed = leaves[R + k * FL - 1].t === 1, still = last || leaves[R + k * FL].t < 0.004;
    const rise = landed && still ? easeW(seg(l, 16, 58)) * (last ? 1 : 1 - easeW(seg(l, 90, 104))) : 0;
    lit = Math.max(lit, rise);
    for (const sk of ['ink', 'dio']) pops[k][sk].group.visible = sk === style && rise > 0.0005;
    pops[k].dio.group.scale.setScalar(DIO); pops[k].dio.group.position.y = top * (1 - DIO);
    pops[k][style].tiers.forEach(t => { const r = easeW(clamp(rise * 1.45 - t.delay)); t.hinge.position.y = top; t.hinge.rotation.x = -Math.PI / 2 + r * t.upright; t.mat.emissiveIntensity = 0.26 + 0.36 * rise; });
    airs[k].forEach((el, i) => {
      const j = airs[k].length - 1 - i, e = easeW(seg(l, 44 + i * 5, 64 + i * 5)) * (last ? 1 : 1 - ease(seg(l, 82 + j * 1.5, 90 + j * 1.5)));
      el.style.opacity = Math.min(1, e * 1.6); el.style.transform = `translate3d(0,${((1 - e) * 104).toFixed(2)}%,0)`;
    });
  });
  key.intensity = 1.6 + 1.3 * lit; hemi.intensity = 0.55 + 0.3 * lit;
}
function draw() { update(st.t); renderer.render(scene, camera); frames++; window.__spike = { travel: st.t, frames }; }
function resize() {
  runway.style.height = (innerHeight * (1 + TRAVEL / 100 * SLOW)) + 'px';
  renderer.setSize(stage.clientWidth, stage.clientHeight, false);
  camera.aspect = stage.clientWidth / stage.clientHeight; camera.updateProjectionMatrix(); ScrollTrigger.refresh(); draw();
}

/* ---------- build ---------- */
(async () => {
  await document.fonts.ready;
  await Promise.all(['300 100px "Cormorant Garamond"', 'italic 300 19px "Cormorant Garamond"', '400 12px "DM Sans"'].map(f => document.fonts.load(f)));
  const drawCover = (g, w, h) => {
  g.strokeStyle = '#0a0f14'; g.lineWidth = 4; g.strokeRect(46, 46, w - 92, h - 92);
  g.strokeStyle = '#f2ede266'; g.lineWidth = 1.2; g.strokeRect(49, 49, w - 98, h - 98);
  g.fillStyle = '#f6f1e6'; g.textAlign = 'left'; g.font = '300 90px "Cormorant Garamond", Georgia, serif';
  ['Your hospital', 'deserves', 'proven hands'].forEach((l, i) => g.fillText(l, 90, 352 + i * 94));
  g.fillRect(92, 672, 120, 2);
  g.font = '400 21px "DM Sans", sans-serif'; g.fillStyle = '#f2ede2cc';
  g.fillText('Selected healthcare work', 92, 200); g.fillText('Nabih Youssef Associates', 92, h - 122); g.fillText('Established 1989', 92, h - 88);
};
  const coverDark = clothTex(CLOTH, drawCover), coverWarm = clothTex('#5a1a22', drawCover), clothWarm = clothTex('#5a1a22');

  const blankR = pageTex('l'), blankL = pageTex('r');
  const halfTitle = pageTex('l', (g, w, h) => { g.fillStyle = '#151515'; g.textAlign = 'center'; g.font = '300 46px "Cormorant Garamond", Georgia, serif'; g.fillText('Nabih Youssef Associates', w / 2, h * 0.42);
    g.fillStyle = '#5b5a56'; g.font = '400 19px "DM Sans", sans-serif'; g.fillText('Established 1989', w / 2, h * 0.42 + 44); });
  // Years on the pages. The riffle runs from 1989 to the first chapter's first year; the leaves before each later chapter run
  // through that project's own years; the left page under each pop-up carries the year the chapter lands on.
  const span = (a, b, n) => Array.from({ length: n }, (_, j) => Math.round(a + (b - a) * j / Math.max(1, n - 1)));
  const landing = k => pageTex('r', yearPage(CH[k].years[1], false, `Chapter ${k + 1}`, 0.9));
  const rif = span(1989, CH[0].years[0], R - 1);
  for (let i = 0; i < R; i++) addLeaf(i === 0 ? halfTitle : pageTex('l', yearPage(rif[i - 1], true)), i === R - 1 ? landing(0) : blankL);
  for (let k = 0; k < CH.length - 1; k++) {
    const ys = span(CH[k + 1].years[0], CH[k + 1].years[1], FL).slice(0, FL - 1);      // the last year is on the landing page
    for (let j = 0; j < FL; j++) addLeaf(pageTex('l', j === 0 ? label(CH[k].page, true) : yearPage(ys[j - 1], true)), j === FL - 1 ? landing(k + 1) : blankL);
  }
  addLeaf(pageTex('l', label(CH[CH.length - 1].page, true)), blankL); addLeaf(blankR, blankL); addLeaf(blankR, blankL);
  // pop-ups: three as V-folds; Stanford in the pieces cut earlier
  const tex = async n => srgb(await loader.loadAsync(`layers/${n}.webp`));
  for (const [k, c] of CH.entries()) {
    if (c.key !== 'stanford') { vfold(pops[k].ink, await tex('ch-' + c.key)); continue; }
    const P = (await (await fetch('layers/pieces.json')).json()).m, S = 1.44;
    const LAY = { core: { z: -0.17, yaw: 0, delay: 0 }, left: { z: -0.06, yaw: 0.17, delay: 0.09 }, right: { z: -0.06, yaw: -0.17, delay: 0.16 }, podium: { z: 0.10, yaw: 0, delay: 0.27 } };
    for (const p of P) { const L = LAY[p.name]; addTier(pops[k].ink, await tex('stanford-m-' + p.name), p.w * S, L.z, 1.45, { x: p.cx * S, yaw: L.yaw, delay: L.delay, lift: Math.max(0, p.lift * S - (LAY.podium.z - L.z) * SEE) }); }
    addTier(pops[k].ink, await tex('stanford-ink-tier-front'), 1.42, 0.28, 1.34, { delay: 0.38 });
  }
  // paper diorama: two painted backdrop wings, the die-cut building folded across the gutter, tree clumps at the front corners
  const dk = await tex('stanford-d-backdrop'), df = await tex('stanford-d-front'), PJ = (await (await fetch('layers/pieces.json')).json()).dm;
  const LAYD = { core: { z: -0.17, yaw: 0, delay: 0.1 }, left: { z: -0.06, yaw: 0.17, delay: 0.16 }, right: { z: -0.06, yaw: -0.17, delay: 0.22 }, podium: { z: 0.10, yaw: 0, delay: 0.3 } };
  for (const [k, c] of CH.entries()) {
    const P = pops[k].dio;
    addTier(P, dk, 0.80, -0.40, 1.50, { x: -0.44, yaw: 0.22, uv: [0, 0.5], delay: 0 });
    addTier(P, dk, 0.80, -0.40, 1.50, { x: 0.44, yaw: -0.22, uv: [0.5, 1], delay: 0.04 });
    if (c.key === 'stanford') {
      for (const p of PJ) { const L = LAYD[p.name]; addTier(P, await tex('stanford-dm-' + p.name), p.w * 1.14, L.z, 1.46, { x: p.cx * 1.14, yaw: L.yaw, delay: L.delay, lift: Math.max(0, p.lift * 1.14 - (LAYD.podium.z - L.z) * SEE) }); }
    } else {
      const t = await tex('dio-' + c.key), S = Math.min(1.3, 0.62 * t.image.width / t.image.height);
      addTier(P, t, S * 0.51, 0.02, 1.46, { x: -S * 0.245, yaw: 0.09, uv: [0, 0.51], delay: 0.14 });
      addTier(P, t, S * 0.51, 0.02, 1.46, { x: S * 0.245, yaw: -0.09, uv: [0.49, 1], delay: 0.22 });
    }
    addTier(P, df, 0.46, 0.32, 1.38, { x: -0.72, uv: [0, 0.43], delay: 0.36 });
    addTier(P, df, 0.46, 0.32, 1.38, { x: 0.72, uv: [0.57, 1], delay: 0.42 });
  }
  // style switch: which pop-up set shows, and the cloth and room that go with it
  const clothMats = []; scene.traverse(o => { for (const m of [].concat(o.material || [])) if (m.map === clothPlain && m !== frontBoard.material[2]) clothMats.push(m); });
  const btns = [...document.querySelectorAll('[data-art]')];
  const setStyle = a => { style = a === 'ink' ? 'ink' : 'dio'; const warm = a === 'dioWarm';
    btns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.art === a))); stage.classList.toggle('warm', warm);
    clothMats.forEach(m => { m.map = warm ? clothWarm : clothPlain; m.needsUpdate = true; });
    frontBoard.material[2].map = warm ? coverWarm : coverDark; frontBoard.material[2].needsUpdate = true; if (window.__ready) draw(); };
  btns.forEach(b => b.addEventListener('click', () => setStyle(b.dataset.art))); setStyle('ink');
  gsap.registerPlugin(ScrollTrigger);
  // Native scrolling is untouched: ScrollTrigger reads the scroll position and eases st.t toward it.
  gsap.to(st, { t: TRAVEL, ease: 'none', onUpdate: draw, scrollTrigger: { trigger: runway, start: 'top top', end: 'bottom bottom', scrub: SCRUB, invalidateOnRefresh: true } });
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 120); });
  resize();
  window.__travel = TRAVEL;
  window.__bench = n => { const gl = renderer.getContext(), ms = [], keep = st.t;
    for (let i = 0; i < n; i++) { st.t = 20 + ((TRAVEL - 20) * i) / n; const t = performance.now(); draw(); gl.finish(); ms.push(performance.now() - t); }
    st.t = keep; draw(); ms.sort((x, y) => x - y); return { median: +ms[n >> 1].toFixed(2), p95: +ms[Math.floor(n * .95)].toFixed(2), max: +ms[n - 1].toFixed(2) }; };
  window.__ready = true;
})();
</script>
